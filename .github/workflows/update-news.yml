name: Update news

on:
  schedule:
    - cron: '23 * * * *' # every hour at :23 - the news sites ask for at most one fetch per hour
  workflow_dispatch: # "Run workflow" button for a manual update

permissions:
  contents: write

# Same group as the other data jobs, so they never write data/ at the same time.
concurrency:
  group: anime-data
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test the news job
        run: node --test # stops here, before publishing anything, if a check fails

      - name: Collect news
        run: node scripts/news.mjs
        env:
          # Optional. Without it, news from the feeds stays in English (with a link);
          # the AniList news is Arabic anyway, because the app writes those sentences.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit if something changed
        run: |
          git config user.name "anime-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No news."
          else
            git commit -m "News $(date -u +'%F %H:%M')"
            git pull --rebase
            git push
          fi
